# Runs the test suite on every push and pull request.
# The suite covers the pure-logic modules (spawner price parsing, audit diffs,
# flag matching) and grows from there; see tests/ and DEPLOYMENT.md.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
